server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep a trailing slash so relative ES module and JSON URLs resolve inside
    # the application's directory.
    location = /game/submarine {
        return 301 /game/submarine/;
    }

    location /game/submarine/ {
        try_files $uri $uri/ =404;
    }
}
